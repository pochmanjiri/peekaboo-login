<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení</title>
    <link rel="preload" as="image" href="../cute_bot/neutral.png">
    <link rel="preload" as="image" href="../cute_bot/happy.png">
    <link rel="preload" as="image" href="../cute_bot/star_eyes.png">
    <link rel="preload" as="image" href="../cute_bot/heart_eyes.png">
    <link rel="preload" as="image" href="../cute_bot/green_light.png">
    <link rel="preload" as="image" href="../cute_bot/covering_eyes.png">
    <link rel="preload" as="image" href="../cute_bot/peeking.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="login-card">
        <div class="bot-wrapper">
            <div class="bot-halo"></div>
            <div class="bot-pop" id="bot-pop">
                <img id="bot" src="../cute_bot/neutral.png" alt="Roztomilý robot" class="bot-image">
            </div>
        </div>

        <h1 class="title">Vítej zpátky</h1>
        <p class="subtitle">Přihlas se a pokračuj ve své cestě</p>

        <form id="login-form" class="form" novalidate>
            <div class="field">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder=" "
                    autocomplete="email"
                    required
                >
                <label for="email">E-mailová adresa</label>
                <div class="field-indicator" id="email-indicator">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12l5 5L20 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <div class="field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder=" "
                    autocomplete="current-password"
                    required
                >
                <label for="password">Heslo</label>
                <button type="button" id="toggle-password" class="toggle-password"
                        aria-label="Zobrazit heslo" data-label-show="Zobrazit heslo" data-label-hide="Skrýt heslo">
                    <svg class="eye-open" viewBox="0 0 24 24" fill="none">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" fill="none">
                        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <div class="row">
                <label class="checkbox">
                    <input type="checkbox" id="remember">
                    <span class="checkmark"></span>
                    <span>Zapamatovat si mě</span>
                </label>
                <a href="#" class="link">Zapomenuté heslo?</a>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="btn-content">
                    <span class="btn-text">Přihlásit se</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <svg class="btn-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12l5 5L20 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </form>

        <p class="footer-text">
            Nemáš účet? <a href="#" class="link link-strong">Zaregistruj se</a>
        </p>
    </main>

    <script src="../script.js"></script>
</body>
</html>
